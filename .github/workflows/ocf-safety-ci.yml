name: OCF Safety CI

on:
  push:
    branches:
      - "maintenance/**"
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Apply deterministic safety patches
        run: |
          python scripts/apply_safe_patch.py
          python scripts/apply_antiloop_hash_patch.py

      - name: Compile main.py
        run: python -m py_compile main.py

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run safety tests
        run: python tests/test_main_safety.py -v

      - name: Commit generated patch to maintenance branch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet -- main.py; then
            echo "main.py already compliant"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add main.py
          git commit -m "fix: align pricing, anti-loop and log safety"
          git push
